<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anniversary Adventure 💖</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    /* Sidebar Styles */
    #sidebar {
      width: 350px;
      background: #fff0f5; /* Lavender blush */
      border-right: 2px solid #ff69b4;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 1000;
    }

    h2 { color: #ff1493; margin-top: 0; }
    
    .clue-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .hint-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ccc;
    }

    #hint-text {
      display: none;
      font-style: italic;
      color: #555;
      margin-top: 5px;
    }

    /* Buttons */
    button {
      cursor: pointer;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 5px;
      border: none;
      transition: background 0.3s;
    }

    .btn-hint { background: #ffb6c1; color: #333; width: 100%; margin-bottom: 5px;}
    .btn-hint:hover { background: #ff69b4; color: white; }

    .btn-reset { background: #ff4d4d; color: white; margin-top: auto; }
    .btn-reset:hover { background: #cc0000; }

    .btn-swimbim { 
      background: #87ceeb; color: white; margin-top: 10px; width: 100%; 
    }
    .btn-swimbim:hover { background: #00bfff; }

    /* New Skip Button Style */
    .btn-skip {
      background: #ddd;
      color: #555;
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
    }
    .btn-skip:hover { background: #bbb; color: #000; }

    /* Map Container */
    #map {
      flex-grow: 1;
      height: 100%;
    }

    /* Popup Styling */
    .custom-popup img {
      max-width: 100%;
      border-radius: 5px;
      margin-top: 10px;
    }
    .popup-btn {
      background: #ff1493;
      color: white;
      padding: 5px 10px;
      margin-top: 10px;
      display: block;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    /* Progress Bar */
    .progress-container {
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #ff69b4;
      width: 0%;
      transition: width 0.5s;
    }
    
    /* Loading overlay */
    #loading {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      font-size: 24px; color: #ff69b4;
    }
  </style>
</head>
<body>

  <div id="loading">Loading our memories... 💖</div>

  <div id="sidebar">
    <h2>Anniversary Hunt 🗺️</h2>
    
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div style="text-align: right; font-size: 12px; color: #666; margin-bottom: 10px;">
      <span id="progress-text">0 / 30</span>
    </div>

    <div id="clue-container" class="clue-box">
      <strong id="clue-title">Clue #1</strong>
      <p id="clue-text">Loading...</p>
      
      <div class="hint-section">
        <button id="hint-btn" class="btn-hint">💡 Need a hint?</button>
        <p id="hint-text"></p>
        <button id="skip-btn" class="btn-skip" onclick="skipClue()">🏳️ Skip this Clue</button>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <p style="font-size: 14px; color: #555;">
        <strong>Instructions:</strong><br>
        Zoom in (level 7+) to see the mystery pins ❓. <br>
        Find the right one to unlock a memory!
      </p>
    </div>

    <button onclick="window.open('https://swimbim.com', '_blank')" class="btn-swimbim">Play Swimbim 🐟</button>
    <button onclick="resetGame()" class="btn-reset">Reset Progress</button>
    
    <div style="margin-top: 20px;">
        <audio id="bg-music" controls loop style="width: 100%;">
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <p style="font-size: 12px; text-align: center; color: #888;">🎶 Playing: Billy Joel Mix</p>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    // --- STATE MANAGEMENT ---
    let allClues = [];
    let currentClueIndex = 0;
    let map;
    let markersLayer = new L.LayerGroup();
    
    // Minimum zoom to reveal pins (as per user request)
    const MIN_ZOOM_TO_SHOW = 7;

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadClues();
      loadProgress();
      
      // Start music on first interaction (browser policy)
      document.body.addEventListener('click', () => {
        const audio = document.getElementById('bg-music');
        // Simple playlist logic could go here, for now placeholder
        if (audio.paused) {
           // audio.play().catch(e => console.log("Audio play prevented until interaction"));
        }
      }, { once: true });
    });

    function initMap() {
      // Start centered on Asia
      map = L.map('map').setView([15, 110], 4);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      markersLayer.addTo(map);

      // Zoom Listener to toggle pin visibility
      map.on('zoomend', updatePinVisibility);
    }

    // --- DATA LOADING ---
    async function loadClues() {
      try {
        const response = await fetch('/clues');
        allClues = await response.json();
        document.getElementById('loading').style.display = 'none';
        renderSidebar();
        renderMap();
      } catch (error) {
        console.error("Failed to load clues:", error);
        document.getElementById('clue-text').innerText = "Error loading clues. Please refresh!";
        document.getElementById('loading').style.display = 'none';
      }
    }

    function loadProgress() {
      const savedIndex = localStorage.getItem('anniversary_clue_index');
      if (savedIndex) {
        currentClueIndex = parseInt(savedIndex, 10);
      }
    }

    function saveProgress() {
      localStorage.setItem('anniversary_clue_index', currentClueIndex);
    }

    function resetGame() {
      if(confirm("Are you sure you want to reset all progress?")) {
        localStorage.removeItem('anniversary_clue_index');
        location.reload();
      }
    }

    // --- ROBUST COORDINATE PARSER (THE FIX) ---
    function getCoords(address) {
      if (!address) return null;
      
      // 1. Remove "goblin" chars and text, keep numbers, minus, dot, comma
      // Replace non-coord chars with space
      let clean = address.replace(/[^0-9.\-,]/g, ' '); 
      
      // 2. Try splitting by comma
      let parts = clean.split(',');

      // 3. If comma split failed (length < 2), try splitting by space
      if (parts.length < 2) {
        parts = clean.split(' ').filter(p => p.trim() !== '');
      }

      // 4. Parse
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]);
        const lng = parseFloat(parts[1]);
        
        // 5. Validate numbers
        if (!isNaN(lat) && !isNaN(lng)) {
          return [lat, lng];
        }
      }
      return null;
    }

    // --- RENDERING ---
    function renderSidebar() {
      if (currentClueIndex >= allClues.length) {
        // Game Over / Victory State
        document.getElementById('clue-title').innerText = "🎉 COMPLETED!";
        document.getElementById('clue-text').innerHTML = "You've found all the memories! <br>Check the final location for your surprise!";
        document.querySelector('.hint-section').style.display = 'none';
        updateProgressBar();
        return;
      }

      const clue = allClues[currentClueIndex];
      document.getElementById('clue-title').innerText = `🧩 Clue #${currentClueIndex + 1}`;
      document.getElementById('clue-text').innerText = clue.clue_text;
      document.getElementById('hint-text').innerText = clue.hint_text;
      document.getElementById('hint-text').style.display = 'none'; // reset hint
      
      updateProgressBar();
    }

    function updateProgressBar() {
      const pct = (currentClueIndex / allClues.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `${currentClueIndex} / ${allClues.length}`;
    }

    // Hint Button Logic with "Safety Net" Zoom
    document.getElementById('hint-btn').addEventListener('click', () => {
      const hintText = document.getElementById('hint-text');
      hintText.style.display = hintText.style.display === 'none' ? 'block' : 'none';
      
      // NEW: Fly to area if hint is clicked
      if (currentClueIndex < allClues.length) {
         const clue = allClues[currentClueIndex];
         const coords = getCoords(clue.address);
         if (coords) {
             // Zoom 10 is close enough to see land, but not give away exact pin immediately
             map.flyTo(coords, 10); 
         }
      }
    });

    // NEW: Skip Logic
    window.skipClue = function() {
        if (!confirm("Stuck? Want to skip this memory and move to the next?")) return;
        
        // Optionally alert the answer so she knows what she missed
        const clue = allClues[currentClueIndex];
        alert(`Skipped! The answer was: ${clue.point_of_interest}`);
        
        currentClueIndex++;
        saveProgress();
        renderSidebar();
        renderMap(); // Re-render to show next set of pins
    };

    function renderMap() {
      markersLayer.clearLayers();
      
      // Only render pins for the CURRENT clue (to avoid confusion)
      // Or render all? The original design seemed to render specific pins.
      // Let's render pins for the current clue only, as per "Scavenger Hunt" logic.
      
      if (currentClueIndex >= allClues.length) {
          // Show Final Victory Pin if needed, or maybe all pins?
          // For now, let's stop rendering pins if game is done.
          return;
      }

      const clue = allClues[currentClueIndex];
      
      // 1. Add REAL Answer Pin
      const realCoords = getCoords(clue.address);
      if (realCoords) {
        addPin(realCoords, true, clue);
      } else {
        console.error("Bad coords for clue:", clue.point_of_interest);
      }

      // 2. Add DUMMY Answer Pin (if exists)
      if (clue.dummy_address) {
        const dummyCoords = getCoords(clue.dummy_address);
        if (dummyCoords) {
          addPin(dummyCoords, false, clue);
        }
      }

      updatePinVisibility();
    }

    function addPin(coords, isCorrect, clueData) {
      // Create a "Mystery" Icon
      const mysteryIcon = L.divIcon({
        className: 'custom-pin',
        html: '<div style="font-size: 24px;">❓</div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const marker = L.marker(coords, { icon: mysteryIcon });

      marker.on('click', () => {
        if (isCorrect) {
          handleCorrectAnswer(marker, clueData);
        } else {
          handleWrongAnswer(marker, clueData);
        }
      });

      markersLayer.addLayer(marker);
    }

    function updatePinVisibility() {
      const currentZoom = map.getZoom();
      // If zoomed out too far, hide markers to keep the map clean/challenging
      if (currentZoom < MIN_ZOOM_TO_SHOW) {
        document.querySelectorAll('.leaflet-marker-icon').forEach(el => el.style.opacity = '0');
      } else {
        document.querySelectorAll('.leaflet-marker-icon').forEach(el => el.style.opacity = '1');
      }
    }

    // --- GAMEPLAY LOGIC ---

    function handleCorrectAnswer(marker, clue) {
      // Victory Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Prepare Popup Content
      let mediaHtml = '';
      if (clue.media_file) {
        // Check if it's a video or image based on extension
        if (clue.media_file.endsWith('.mp4') || clue.media_file.endsWith('.mov')) {
            mediaHtml = `<video controls autoplay loop style="width:100%; border-radius:10px; margin-top:10px;">
                            <source src="/media/${clue.media_file}" type="video/mp4">
                         </video>`;
        } else {
            mediaHtml = `<img src="/media/${clue.media_file}" alt="Memory" />`;
        }
      }

      const content = `
        <div class="custom-popup">
          <h3>✅ Correct: ${clue.point_of_interest}</h3>
          <p>${clue.love_note}</p>
          ${mediaHtml}
          <button class="popup-btn" onclick="nextClue()">Next Memory ➡️</button>
        </div>
      `;

      marker.bindPopup(content, { maxWidth: 300 }).openPopup();
      
      // Change icon to Heart or something resolved
      marker.setIcon(L.divIcon({
          html: '<div style="font-size: 24px;">💖</div>',
          iconSize: [30, 30]
      }));
    }

    function handleWrongAnswer(marker, clue) {
      // 33% chance of Rick Roll or Funny Video if configured
      // For simplicity, let's show the dummy text
      const text = clue.dummy_popup_text || "Nope! Not here bumbum! Try again! 😜";
      
      marker.bindPopup(`
        <div class="custom-popup">
          <h3>❌ Oops!</h3>
          <p>${text}</p>
        </div>
      `).openPopup();
    }

    // Global function for popup button
    window.nextClue = function() {
      currentClueIndex++;
      saveProgress();
      
      // Close popup
      map.closePopup();
      
      // Re-render
      renderSidebar();
      renderMap();
      
      // Reset zoom slightly to encourage looking for next spot
      map.flyTo([15, 110], 4); 
    };

  </script>
</body>
</html>
