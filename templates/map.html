<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anniversary Adventure 💖</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    /* Sidebar Styles */
    #sidebar {
      width: 350px;
      background: #fff0f5; /* Lavender blush */
      border-right: 2px solid #ff69b4;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 1000;
    }

    h2 { color: #ff1493; margin-top: 0; }
    
    .clue-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .hint-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ccc;
    }

    #hint-text {
      display: none;
      font-style: italic;
      color: #555;
      margin-top: 5px;
    }

    /* Buttons */
    button {
      cursor: pointer;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 5px;
      border: none;
      transition: background 0.3s;
    }

    .btn-hint { background: #ffb6c1; color: #333; width: 100%; margin-bottom: 5px;}
    .btn-hint:hover { background: #ff69b4; color: white; }

    .btn-reset { background: #ff4d4d; color: white; margin-top: auto; }
    .btn-reset:hover { background: #cc0000; }

    .btn-skip {
      background: #ddd;
      color: #555;
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
    }
    .btn-skip:hover { background: #bbb; color: #000; }

    /* Swimbim Section */
    .swimbim-container {
      margin-top: 20px;
      text-align: center;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }
    .swimbim-qr {
      width: 100%;
      max-width: 150px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .swimbim-qr:hover {
      transform: scale(1.05);
    }
    .btn-swimbim { 
      background: #87ceeb; color: white; margin-top: 5px; width: 100%; 
    }
    .btn-swimbim:hover { background: #00bfff; }

    /* Map Container */
    #map {
      flex-grow: 1;
      height: 100%;
    }

    /* Popup Styling */
    .custom-popup img {
      max-width: 100%;
      border-radius: 5px;
      margin-top: 10px;
    }
    .popup-btn {
      background: #ff1493;
      color: white;
      padding: 5px 10px;
      margin-top: 10px;
      display: block;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    /* Progress Bar */
    .progress-container {
      background: #e0e0e0;
      border-radius: 10px;
      height: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #ff69b4;
      width: 0%;
      transition: width 0.5s;
    }
    
    /* Loading overlay */
    #loading {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      font-size: 24px; color: #ff69b4;
    }

    /* Music Player */
    .music-player {
        margin-top: 20px;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
    }
  </style>
</head>
<body>

  <div id="loading">Loading our memories... 💖</div>

  <div id="sidebar">
    <h2>Anniversary Hunt 🗺️</h2>
    
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div style="text-align: right; font-size: 12px; color: #666; margin-bottom: 10px;">
      <span id="progress-text">0 / 30</span>
    </div>

    <div id="clue-container" class="clue-box">
      <strong id="clue-title">Clue #1</strong>
      <p id="clue-text">Loading...</p>
      
      <div class="hint-section">
        <button id="hint-btn" class="btn-hint">💡 Need a hint?</button>
        <p id="hint-text"></p>
        <button id="skip-btn" class="btn-skip" onclick="skipClue()">🏳️ Skip this Clue</button>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <p style="font-size: 14px; color: #555;">
        <strong>Instructions:</strong><br>
        Zoom in (level 7+) to see the mystery pins ❓. <br>
        Find the right one to unlock a memory!
      </p>
    </div>

    <div class="swimbim-container">
        <a href="https://vincentdarrigo.github.io/swimbim/" target="_blank">
            <img src="/media/swimbim_qr.png" alt="Swimbim QR" class="swimbim-qr" onerror="this.style.display='none'">
        </a>
        <button onclick="window.open('https://vincentdarrigo.github.io/swimbim/', '_blank')" class="btn-swimbim">Play Swimbim 🐟</button>
    </div>

    <button onclick="resetGame()" class="btn-reset">Reset Progress</button>
    
    <div class="music-player">
        <p style="font-size: 12px; margin: 0 0 5px 0; color: #888;">🎶 Billy Joel Mix</p>
        <audio id="bg-music" controls style="width: 100%;">
            Your browser does not support the audio element.
        </audio>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    // --- 🎵 MUSIC PLAYLIST SETUP ---
    // IMPORTANT: Update these filenames to match exactly what is in your static/media folder!
    const musicPlaylist = [
        'vienna.mp3',
        'we-didnt-start-the-fire.mp3',
        'you-may-be-right.mp3',
        'allentown.mp3',
        'a-matter-of-trust.mp3',
        'and-so-it-goes.mp3',
        'angry-young-man.mp3',
        'an-innocent-man.mp3',
        'big-shot.mp3',
        'captain-jack.mp3',
        'dont-ask-me-why.mp3',
        'everybody-loves-you-now.mp3',
        'goodnight-saigon.mp3',
        'i-go-to-extremes.mp3',
        'italian-restaurant.mp3',
        'its-still-rock-and-roll-to-me.mp3',
        'just-the-way-you-are.mp3',
        'keeping-the-faith.mp3',
        'movin-out.mp3',
        'my-life.mp3',
        'new-york-state-of-mind.mp3',
        'only-the-good-die-young.mp3',
        'piano-man.mp3',
        'pressure.mp3',
        'shes-always-a-woman.mp3',
        'shes-got-a-way.mp3',
        'tell-her-about-it.mp3',
        'the-entertainer.mp3',
        'the-longest-time.mp3',
        'the-river-of-dreams.mp3',
        'uptown-girl.mp3'
    ];
    let currentTrackIndex = 0;

    // --- STATE MANAGEMENT ---
    let allClues = [];
    let currentClueIndex = 0;
    let map;
    let markersLayer = new L.LayerGroup();
    
    // Minimum zoom to reveal pins
    const MIN_ZOOM_TO_SHOW = 7;

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadClues();
      loadProgress();
      initAudio();
    });

    function initMap() {
      // Start centered on Asia
      map = L.map('map').setView([15, 110], 4);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      markersLayer.addTo(map);

      // Zoom Listener to toggle pin visibility
      map.on('zoomend', updatePinVisibility);
    }

    function initAudio() {
        const audio = document.getElementById('bg-music');
        
        // Function to load track
        function loadTrack(index) {
            if (musicPlaylist.length === 0) return;
            // Ensure index wraps around
            if (index >= musicPlaylist.length) currentTrackIndex = 0;
            
            audio.src = `/media/${musicPlaylist[currentTrackIndex]}`;
            audio.load();
        }

        // Load first track
        loadTrack(currentTrackIndex);

        // When ended, play next
        audio.addEventListener('ended', () => {
            currentTrackIndex++;
            loadTrack(currentTrackIndex);
            audio.play();
        });

        // Attempt autoplay (might be blocked by browser until interaction)
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(e => console.log("User interaction required for audio"));
            }
        }, { once: true });
    }

    // --- DATA LOADING ---
    async function loadClues() {
      try {
        const response = await fetch('/clues');
        allClues = await response.json();
        document.getElementById('loading').style.display = 'none';
        renderSidebar();
        renderMap();
      } catch (error) {
        console.error("Failed to load clues:", error);
        document.getElementById('clue-text').innerText = "Error loading clues. Please refresh!";
        document.getElementById('loading').style.display = 'none';
      }
    }

    function loadProgress() {
      const savedIndex = localStorage.getItem('anniversary_clue_index');
      if (savedIndex) {
        currentClueIndex = parseInt(savedIndex, 10);
      }
    }

    function saveProgress() {
      localStorage.setItem('anniversary_clue_index', currentClueIndex);
    }

    function resetGame() {
      if(confirm("Are you sure you want to reset all progress?")) {
        localStorage.removeItem('anniversary_clue_index');
        location.reload();
      }
    }

    // --- ROBUST COORDINATE PARSER ---
    function getCoords(address) {
      if (!address) return null;
      let clean = address.replace(/[^0-9.\-,]/g, ' '); 
      let parts = clean.split(',');
      if (parts.length < 2) {
        parts = clean.split(' ').filter(p => p.trim() !== '');
      }
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]);
        const lng = parseFloat(parts[1]);
        if (!isNaN(lat) && !isNaN(lng)) return [lat, lng];
      }
      return null;
    }

    // --- RENDERING ---
    function renderSidebar() {
      if (currentClueIndex >= allClues.length) {
        document.getElementById('clue-title').innerText = "🎉 COMPLETED!";
        document.getElementById('clue-text').innerHTML = "You've found all the memories! <br>Check the final location for your surprise!";
        document.querySelector('.hint-section').style.display = 'none';
        updateProgressBar();
        return;
      }

      const clue = allClues[currentClueIndex];
      document.getElementById('clue-title').innerText = `🧩 Clue #${currentClueIndex + 1}`;
      document.getElementById('clue-text').innerText = clue.clue_text;
      document.getElementById('hint-text').innerText = clue.hint_text;
      document.getElementById('hint-text').style.display = 'none';
      
      updateProgressBar();
    }

    function updateProgressBar() {
      const pct = (currentClueIndex / allClues.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `${currentClueIndex} / ${allClues.length}`;
    }

    document.getElementById('hint-btn').addEventListener('click', () => {
      const hintText = document.getElementById('hint-text');
      hintText.style.display = hintText.style.display === 'none' ? 'block' : 'none';
      if (currentClueIndex < allClues.length) {
         const clue = allClues[currentClueIndex];
         const coords = getCoords(clue.address);
         if (coords) map.flyTo(coords, 10); 
      }
    });

    window.skipClue = function() {
        if (!confirm("Stuck? Want to skip this memory and move to the next?")) return;
        const clue = allClues[currentClueIndex];
        alert(`Skipped! The answer was: ${clue.point_of_interest}`);
        currentClueIndex++;
        saveProgress();
        renderSidebar();
        renderMap(); 
    };

    // --- MAP LOGIC (ALL PINS VISIBLE) ---
    function renderMap() {
      markersLayer.clearLayers();
      
      // Loop through ALL clues to populate the map
      allClues.forEach((clue, index) => {
          const isFuture = index > currentClueIndex;
          const isPast = index < currentClueIndex;
          const isCurrent = index === currentClueIndex;

          // 1. Plot Real Location
          const realCoords = getCoords(clue.address);
          if (realCoords) {
              if (isPast) {
                  // Solved Memory (Heart)
                  addPin(realCoords, 'solved', clue, index);
              } else {
                  // Current OR Future (Mystery)
                  // Future pins act as "dummies" effectively until it is their turn
                  addPin(realCoords, isCurrent ? 'current' : 'future', clue, index);
              }
          }

          // 2. Plot Dummy Location (Always Mystery)
          if (clue.dummy_address) {
              const dummyCoords = getCoords(clue.dummy_address);
              if (dummyCoords) {
                  addPin(dummyCoords, 'dummy', clue, index);
              }
          }
      });

      updatePinVisibility();
    }

    function addPin(coords, type, clueData, index) {
      let iconHtml = '❓'; // Default Mystery
      let className = 'custom-pin';
      
      if (type === 'solved') {
          iconHtml = '💖';
      }

      const icon = L.divIcon({
        className: className,
        html: `<div style="font-size: 24px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));">${iconHtml}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const marker = L.marker(coords, { icon: icon });

      marker.on('click', () => {
        if (type === 'solved') {
            // Re-show memory
            showMemoryPopup(marker, clueData, false);
        } else if (type === 'current') {
            // Correct Answer!
            handleCorrectAnswer(marker, clueData);
        } else if (type === 'future') {
            // Future real answer (act as dummy/locked)
            showDummyPopup(marker, "This location feels special... but not for this clue! Keep searching! 🔒");
        } else {
            // Dummy pin
            showDummyPopup(marker, clueData.dummy_popup_text || "Nope! Not here bumbum! Try again! 😜");
        }
      });

      markersLayer.addLayer(marker);
    }

    function updatePinVisibility() {
      const currentZoom = map.getZoom();
      if (currentZoom < MIN_ZOOM_TO_SHOW) {
        document.querySelectorAll('.leaflet-marker-icon').forEach(el => el.style.opacity = '0');
      } else {
        document.querySelectorAll('.leaflet-marker-icon').forEach(el => el.style.opacity = '1');
      }
    }

    // --- POPUP LOGIC ---

    function handleCorrectAnswer(marker, clue) {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      showMemoryPopup(marker, clue, true);
    }

    function showMemoryPopup(marker, clue, isNewSolve) {
      let mediaHtml = '';
      if (clue.media_file) {
        if (clue.media_file.endsWith('.mp4') || clue.media_file.endsWith('.mov')) {
            mediaHtml = `<video controls autoplay loop style="width:100%; border-radius:10px; margin-top:10px;">
                            <source src="/media/${clue.media_file}" type="video/mp4">
                         </video>`;
        } else {
            mediaHtml = `<img src="/media/${clue.media_file}" alt="Memory" />`;
        }
      }

      let btnHtml = '';
      if (isNewSolve) {
          btnHtml = `<button class="popup-btn" onclick="nextClue()">Next Memory ➡️</button>`;
      } else {
          btnHtml = `<p style="text-align:center; font-size:12px; color:#666;">(Memory Solved)</p>`;
      }

      const content = `
        <div class="custom-popup">
          <h3>✅ Correct: ${clue.point_of_interest}</h3>
          <p>${clue.love_note}</p>
          ${mediaHtml}
          ${btnHtml}
        </div>
      `;

      marker.bindPopup(content, { maxWidth: 300 }).openPopup();
      
      if (isNewSolve) {
          marker.setIcon(L.divIcon({
              html: '<div style="font-size: 24px;">💖</div>',
              iconSize: [30, 30]
          }));
      }
    }

    function showDummyPopup(marker, text) {
      marker.bindPopup(`
        <div class="custom-popup">
          <h3>❌ Oops!</h3>
          <p>${text}</p>
        </div>
      `).openPopup();
    }

    window.nextClue = function() {
      currentClueIndex++;
      saveProgress();
      map.closePopup();
      renderSidebar();
      renderMap();
      // Zoom out to reset view for next hunt
      map.flyTo([15, 110], 4); 
    };

  </script>
</body>
</html>
